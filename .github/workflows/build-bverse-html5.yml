name: Build B-Verse HTML5 and deploy Pages
# Explicitly register dialogue JSON text assets in the HTML5 build
# Normalize case-colliding dialogue JSON before HTML5 asset scan
# Rebuild source after HTML5 menu sound guard update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4
      - name: Checkout B-Verse source
        uses: actions/checkout@v4
        with:
          repository: Playboyjusthegreat27/B-verse
          ref: v1-release
          path: b-verse
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5
      - name: Setup haxelib
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libffi8 libssl-dev ffmpeg
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libffi.so.8 /usr/lib/x86_64-linux-gnu/libffi.so.6 || true
          sudo ldconfig
      - name: Install Haxe libraries
        working-directory: b-verse
        run: |
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.11.0 --quiet
          haxelib install flixel-addons 2.10.0 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib install hxcpp --quiet
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
          haxelib set flixel 4.11.0
          haxelib set flixel-addons 2.10.0
          haxelib set flixel-ui 2.5.0
          haxelib run lime setup
      - name: Convert all game OGG assets before building the asset manifest
        working-directory: b-verse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          assets_root = Path("assets")
          converted = 0
          for source in assets_root.rglob("*.ogg"):
              relative = source.relative_to(assets_root)
              if relative.parts[:2] == ("preload", "videos"):
                  continue
              target = source.with_suffix(".mp3")
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-i", str(source), "-codec:a", "libmp3lame",
                  "-qscale:a", "2", str(target)
              ], check=True)
              converted += 1
          print(f"Converted {converted} OGG assets before building")
          PY
      - name: Build HTML5
        working-directory: b-verse
        run: haxelib run lime build html5 -release
        timeout-minutes: 30
      - name: Convert preload OGG sounds and music for HTML5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          preload_root = Path("b-verse/assets/preload")
          output_root = Path("b-verse/export/release/html5/bin/assets")
          for source in preload_root.rglob("*.ogg"):
              relative = source.relative_to(preload_root)
              if relative.parts and relative.parts[0] in ("videos", "songs"):
                  continue
              target = output_root / relative.with_suffix(".mp3")
              target.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-i", str(source), "-codec:a", "libmp3lame",
                  "-qscale:a", "2", str(target)
              ], check=True)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: b-verse/export/release/html5/bin
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
