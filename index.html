<!DOCTYPE html>
<html lang="en">
<head>
	
	<meta charset="utf-8">
	
	<title>Friday Night Funkin' B verse</title>
	
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="mobile-web-app-capable" content="yes">
	
	
	<link rel="shortcut icon" type="image/png" href="./favicon.png">
	
	<style>
		html,body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
		#openfl-content { background: #000000; width: 100%; height: 100%; }
		@font-face {
			font-family: 'VCR OSD Mono';
			src: url('assets/fonts/vcr.eot?#iefix') format('embedded-opentype'),
			url('assets/fonts/vcr.woff') format('woff'),
			url('assets/fonts/vcr.ttf') format('truetype'),
			url('assets/fonts/vcr.svg#VCR%20OSD%20Mono') format('svg');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Pixel Arial 11 Bold';
			src: url('assets/fonts/pixel.eot?#iefix') format('embedded-opentype'),
			url('assets/fonts/pixel.woff') format('woff'),
			url('assets/fonts/pixel.otf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Excelorate';
			src: url('assets/fonts/Future.eot?#iefix') format('embedded-opentype'),
			url('assets/fonts/Future.woff') format('woff'),
			url('assets/fonts/Future.ttf') format('truetype'),
			url('assets/fonts/Future.svg#Excelorate') format('svg');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Nokia Cellphone FC Small';
			src: url('flixel/fonts/nokiafc22.eot?#iefix') format('embedded-opentype'),
			url('flixel/fonts/nokiafc22.woff') format('woff'),
			url('flixel/fonts/nokiafc22.ttf') format('truetype'),
			url('flixel/fonts/nokiafc22.svg#Nokia%20Cellphone%20FC%20Small') format('svg');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Monsterrat';
			src: url('flixel/fonts/monsterrat.eot?#iefix') format('embedded-opentype'),
			url('flixel/fonts/monsterrat.woff') format('woff'),
			url('flixel/fonts/monsterrat.ttf') format('truetype'),
			url('flixel/fonts/monsterrat.svg#Monsterrat') format('svg');
			font-weight: normal;
			font-style: normal;
		}
	</style>
	
	<script type="text/javascript">
		// Create and resume AudioContext immediately before loading game
		window.audioContextResumed = false;
		window.gameAudioContext = null;
		
		// Try to create an AudioContext early
		try {
			var AudioContextClass = window.AudioContext || window.webkitAudioContext;
			if (AudioContextClass) {
				window.gameAudioContext = new AudioContextClass();
			}
		} catch (e) {
			console.log('AudioContext creation failed:', e);
		}
		
		// Function to resume audio context
		function resumeAudioContextNow() {
			if (!window.audioContextResumed && window.gameAudioContext) {
				if (window.gameAudioContext.state === 'suspended') {
					window.gameAudioContext.resume().then(function() {
						window.audioContextResumed = true;
						console.log('✓ AudioContext resumed');
					}).catch(function(e) {
						console.log('Error resuming AudioContext:', e);
					});
				} else if (window.gameAudioContext.state === 'running') {
					window.audioContextResumed = true;
					console.log('✓ AudioContext already running');
				}
			}
		}
		
		// Resume immediately on any user interaction
		document.addEventListener('click', resumeAudioContextNow, true);
		document.addEventListener('keydown', resumeAudioContextNow, true);
		document.addEventListener('touchstart', resumeAudioContextNow, true);
		document.addEventListener('mousedown', resumeAudioContextNow, true);
	</script>
	
	<script type="text/javascript" src="./PsychEngine.js"></script>
	
	<script>
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById ("viewport");
			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
	</script>
	
</head>
<body>
	
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>
	
	<div id="openfl-content"></div>
	
	<script type="text/javascript">
		// Resume audio context before embedding game
		resumeAudioContextNow();
		
		lime.embed ("PsychEngine", "openfl-content", 1280, 720, { parameters: {} });
	</script>
	
	<script type="text/javascript">
		// Keep trying to resume audio context every 100ms until successful
		var resumeInterval = setInterval(function() {
			if (window.audioContextResumed) {
				clearInterval(resumeInterval);
			} else {
				resumeAudioContextNow();
			}
		}, 100);
		
		// Stop after 5 seconds
		setTimeout(function() {
			clearInterval(resumeInterval);
		}, 5000);
	</script>
	
</body>
</html>
