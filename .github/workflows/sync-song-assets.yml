name: Sync B-Verse song audio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HTML repo
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install audio converter
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Replace HTML audio with source B-Verse audio
        run: |
          git clone --depth 1 --branch v1-release https://github.com/Playboyjusthegreat27/B-verse.git /tmp/b-verse
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          source_root = Path("/tmp/b-verse/assets/songs")
          target_root = Path("assets/songs")
          target_root.mkdir(parents=True, exist_ok=True)

          # Copy every MP3 from the actual B-Verse source, overwriting stale base-game audio.
          for source in source_root.rglob("*.mp3"):
              target = target_root / source.relative_to(source_root)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              print(f"Copied source audio: {source.relative_to(source_root)}", flush=True)

          # Convert OGG-only tracks for the HTML build. Prefer source MP3 whenever it exists.
          for source in source_root.rglob("*.ogg"):
              if source.with_suffix(".mp3").exists():
                  continue
              target = target_root / source.relative_to(source_root).with_suffix(".mp3")
              target.parent.mkdir(parents=True, exist_ok=True)
              print(f"Converting source audio: {source.relative_to(source_root)}", flush=True)
              subprocess.run([
                  "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                  "-i", str(source), "-codec:a", "libmp3lame",
                  "-qscale:a", "2", str(target)
              ], check=True)
          PY
      - name: Commit synced audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/songs
          git diff --cached --quiet || git commit -m "Replace stale audio with B-Verse source tracks"
          git push
